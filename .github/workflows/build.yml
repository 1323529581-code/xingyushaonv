
name: Build AuthPlugin dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "AuthPlugin.m"
      - "AuthPlugin.h"
      - "AuthCodes.h"
      - "Makefile"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dylib
        run: |
          xcodebuild -version
          make clean
          make
          file build/AuthPlugin.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: AuthPlugin-ios-arm64
          path: build/AuthPlugin.dylib
          if-no-files-found: error
          retention-days: 14
