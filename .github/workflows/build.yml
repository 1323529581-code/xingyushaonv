
name: Build AuthPlugin dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "AuthPlugin.m"
      - "AuthCodes.h"
      - ".github/workflows/build.yml"

jobs:
  build:
    name: Build iOS arm64 dylib
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check source files
        shell: bash
        run: |
          set -euo pipefail
          test -f AuthPlugin.m
          echo "AuthPlugin.m found"

      - name: Build dylib
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          mkdir -p build

          xcrun --sdk iphoneos clang \
            -fobjc-arc \
            -fmodules \
            -dynamiclib \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -framework Foundation \
            -framework UIKit \
            -framework Security \
            -Wl,-install_name,@rpath/AuthPlugin.dylib \
            -o build/AuthPlugin.dylib \
            AuthPlugin.m

          echo "Build completed"
          file build/AuthPlugin.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuthPlugin-ios-arm64
          path: build/AuthPlugin.dylib
          if-no-files-found: error
          retention-days: 14
