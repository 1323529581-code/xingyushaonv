name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Theos
      uses: theos/theos@master
      with:
        theos-path: ${{ github.workspace }}/theos

    - name: Setup dependencies
      run: |
        brew install ldid xz
        brew install dpkg || true

    - name: Build Tweak
      run: |
        export THEOS=${{ github.workspace }}/theos
        make package FINALPACKAGE=1

    - name: Upload Deb Package
      uses: actions/upload-artifact@v4
      with:
        name: StarLustsAuth-Deb
        path: packages/*.deb
