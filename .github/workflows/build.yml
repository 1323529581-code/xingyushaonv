name: Build AuthPlugin.dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode & SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile AuthPlugin.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang \
            -dynamiclib \
            -arch arm64 \
            -arch arm64e \
            -isysroot "$SDK" \
            -framework UIKit \
            -framework Foundation \
            -fobjc-arc \
            -O2 \
            -Wno-deprecated-declarations \
            -install_name @executable_path/Frameworks/AuthPlugin.dylib \
            AuthPlugin.m \
            -o AuthPlugin.dylib

      - name: Install ldid and sign
        run: |
          brew install ldid
          ldid -S AuthPlugin.dylib

      - name: Verify binary
        run: |
          file AuthPlugin.dylib
          ls -la AuthPlugin.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: AuthPlugin-dylib
          path: AuthPlugin.dylib
          if-no-files-found: error
